<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>4th Semester - UniHub</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
      }

      body {
        min-height: 100vh;
        background: linear-gradient(135deg, #667eea, #764ba2);
        padding: 40px 20px;
      }

      .container {
        max-width: 900px;
        margin: auto;
      }

      .header {
        text-align: center;
        color: white;
        margin-bottom: 40px;
      }

      .header h1 {
        font-size: 36px;
        margin-bottom: 10px;
      }

      .header p {
        font-size: 18px;
      }

      .notes-container {
        background: white;
        color: #333;
        padding: 25px;
        margin: 20px auto;
        width: 90%;
        max-width: 700px;
        border-radius: 15px;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
      }

      .notes-container h2 {
        color: #5b4bdb;
        margin-bottom: 10px;
      }

      .notes-container p {
        color: #666;
        margin-bottom: 20px;
      }

      .button {
        display: inline-block;
        background: #5b4bdb;
        color: white;
        padding: 12px 20px;
        border-radius: 8px;
        text-decoration: none;
        margin-right: 10px;
      }

      .button:hover {
        background: #4535b5;
      }

      .back-button {
        display: block;
        width: fit-content;
        margin: 30px auto;
        color: white;
        text-decoration: none;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <div class="header">
        <h1>4th Semester</h1>
        <p>University Syllabus and Study Materials</p>
      </div>

      <div class="notes-container">
        <h2>📘 4th Semester Syllabus</h2>

        <p>View the complete official syllabus for the 4th semester.</p>

        <a href="semester4-syllabus.pdf" target="_blank" class="button">
          View Syllabus
        </a>

        <a href="semester4-syllabus.pdf" download class="button">
          Download PDF
        </a>
      </div>

      <a href="../" class="back-button"> ← Back to Notes </a>
    </div>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        if (localStorage.getItem("theme") === "light") {
          document.body.classList.add("light-mode");
        }
      });
    </script>
  </body>
</html>
